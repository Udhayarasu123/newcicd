- name: SSH into EC2 and Deploy
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ubuntu
    key: ${{ secrets.EC2_SSH_KEY }}
    port: 22
    script: |
      cd /home/ubuntu/app
      git pull origin main
      docker compose down
      docker compose up -d --build